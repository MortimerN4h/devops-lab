# CI/CD for the Node app: test -> build + push images to ECR -> deploy to the app server (via AWS SSM).
name: node-app

on:
  push:
    branches: [main]
    paths: # run only when something this app depends on changes (saves free minutes)
      - "task_week1/apps/nodejs/**"
      - "task_week1/tests/**"
      - "task_week1/API.md"
      - "task_week1/deploy/**"
      - ".github/workflows/node.yml"
  workflow_dispatch: {} # adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write # allow the job to request the GitHub OIDC token (needed for AWS login)
  contents: read  # allow actions/checkout to read the repo

env:
  AWS_REGION: us-east-1
  APP_DIR: task_week1/apps/nodejs
  IMAGE_PREFIX: devops-lab/node # ECR repos: devops-lab/node-frontend, devops-lab/node-backend

jobs:
  # ---------- CI: does the app work? ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        working-directory: ${{ env.APP_DIR }}
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:18080/api/health && exit 0
            sleep 2
          done
          echo "API did not become ready"; exit 1

      - name: API tests
        run: ./task_week1/tests/api-test.sh

      - name: Logs on failure
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose logs

  # ---------- CD: build + push images (only if tests passed) ----------
  push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend] # two parallel jobs, one per image
    steps:
      - uses: actions/checkout@v5

      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}/${{ matrix.component }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
          cache-from: type=gha,scope=node-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.component }}

  # ---------- CD: deploy to the app server (only if both images were pushed) ----------
  deploy:
    needs: push
    runs-on: ubuntu-latest
    # Never run two deploys at the same time; a newer one waits for the running one to finish.
    concurrency:
      group: deploy-node
      cancel-in-progress: false
    steps:
      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the app server
        id: find
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=devops-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$ID" ]; then
            # Server destroyed/stopped to save money: the images are in ECR, so just skip.
            echo "::notice::No running devops-app server, skipping deploy"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Deploy with SSM Run Command
        if: steps.find.outputs.id != ''
        env:
          INSTANCE_ID: ${{ steps.find.outputs.id }}
        run: |
          # The script that runs ON THE SERVER, as root, one line per command.
          SCRIPT=$(cat <<'EOS'
          set -eu
          export HOME=/root
          sudo -u ubuntu -H git -C /opt/devops-lab pull --ff-only
          cd /opt/devops-lab/task_week1/deploy
          docker compose pull node-frontend node-backend
          docker compose up -d
          docker image prune -f
          docker compose ps
          EOS
          )
          # jq turns the lines into the JSON SSM expects: {"commands": ["line1", "line2", ...]}
          PARAMS=$(printf '%s\n' "$SCRIPT" | sed 's/^ *//' | jq -Rn '{commands: [inputs]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy node ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          # Wait until it finishes (fails if the script failed), then always print the server's output.
          STATUS=0
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || STATUS=$?
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          exit $STATUS

      - name: Smoke test the public URL
        if: steps.find.outputs.id != '' && vars.NODE_URL != ''
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${{ vars.NODE_URL }}/api/health"
