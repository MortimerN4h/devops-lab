services:
  frontend:
    build: ./frontend
    ports:
      - "18082:80" # 18080 = Node, 18081 = Python: all apps can run at the same time
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis-seed:
        condition: service_completed_successfully # wait until the seed container EXITED with code 0

  redis:
    image: redis:7-alpine
    # --appendonly yes: also write every change to a file in /data, so notes survive a restart
    # (by default Redis keeps data in RAM and only takes snapshots from time to time)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # answers PONG when ready
      interval: 5s
      timeout: 5s
      retries: 10

  redis-seed:
    image: redis:7-alpine # same image, used only for its redis-cli tool
    entrypoint: ["sh", "/seed.sh"]
    volumes:
      - ./db/seed.sh:/seed.sh:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: "no" # a one-shot job: run, exit, stay stopped

volumes:
  redis-data:
