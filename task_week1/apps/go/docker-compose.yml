services:
  frontend:
    build: ./frontend
    ports:
      - "18082:80" # 18080 = Node, 18081 = Python: all apps can run at the same time
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://notes:notes@postgres:5432/notesdb # the data (the truth)
      REDIS_ADDR: redis:6379                                     # the cache (a copy, may be lost)
    depends_on:
      postgres:
        condition: service_healthy # cannot work without the database
      redis:
        condition: service_started # only a cache: "running" is enough

  postgres:
    image: postgres:16-alpine
    environment: # the image creates this user + database at first start
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes # local dev only; production reads it from .env
      POSTGRES_DB: notesdb
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notes -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # A pure cache: no disk at all (--save "" = no snapshots, appendonly no), at most 64 MB of RAM,
    # and when full, evict the least recently used keys (allkeys-lru) instead of refusing writes.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  pg-data:
