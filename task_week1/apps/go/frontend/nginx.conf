server {
    listen 80;

    # Static files built by Vite (same React app as apps/nodejs)
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container (resolved by compose service name)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else: serve the file, or fall back to index.html (single-page app)
    location / {
        try_files $uri /index.html;
    }
}
