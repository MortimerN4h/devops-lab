server {
    listen 80;

    # Docker's internal DNS (127.0.0.11) is asked again every 10 s, so a container that was RECREATED
    # (new IP) is found. Without this, nginx resolves names only once at start and keeps the old IP -> 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static files built by Vite (same React app as apps/nodejs)
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container (resolved by compose service name)
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend; # a variable = resolve at request time (with the resolver above)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else: serve the file, or fall back to index.html (single-page app)
    location / {
        try_files $uri /index.html;
    }
}
