# Spring Boot reads this file at startup. Any line can be overridden by an environment variable:
# spring.datasource.url  <->  SPRING_DATASOURCE_URL  (dots -> underscores, UPPER CASE)
spring.application.name=notes

# Database (local defaults; docker-compose.yml overrides them with environment variables)
spring.datasource.url=jdbc:mysql://localhost:3306/notesdb?connectionTimeZone=UTC
spring.datasource.username=notes
spring.datasource.password=notes

# The table is created by db/init.sql, not by Hibernate ("none" = never touch the schema)
spring.jpa.hibernate.ddl-auto=none
# Store and read timestamps in UTC whatever the server's time zone is
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# No DB connection held open while the JSON response is written (Spring warns when this is on)
spring.jpa.open-in-view=false

# On "docker stop": stop accepting requests, finish the running ones, then exit
server.shutdown=graceful
