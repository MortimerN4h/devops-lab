services:
  frontend:
    build: ./frontend
    ports:
      - "18081:80" # 18080 is the Node app: both stacks can run at the same time
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://notes:notes@postgres:5432/notesdb
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment: # the image creates this user + database at first start
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes # local dev only; production reads it from .env
      POSTGRES_DB: notesdb
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h 127.0.0.1 = check over TCP. While init.sql runs, Postgres only listens on a local
      # socket, so a plain pg_isready would say "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notes -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
