# Production stack on the app EC2 (cloned to /opt/devops-lab/task_week1/deploy).
# One "edge" Nginx is the only thing open to the internet; it routes each subdomain to an app.
# Variables come from .env (written by user_data, not committed):
#   REGISTRY   = <account>.dkr.ecr.us-east-1.amazonaws.com
#   DOMAIN     = your domain
#   NGINX_MODE = http (before the certificate) | https (after certbot)
#   PYTHON_DB_PASSWORD = Postgres password of the Python app (e.g. openssl rand -hex 16)
#   GO_DB_PASSWORD     = Postgres password of the Go app (same way)
#   JAVA_DB_PASSWORD, JAVA_DB_ROOT_PASSWORD = MySQL passwords of the Java app (app user, admin user)
name: devops-lab

services:
  edge:
    image: nginx:1.27-alpine
    container_name: edge # fixed name so certbot's hook can run: docker exec edge nginx -s reload
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN} # used inside the *.template files
    volumes:
      # The nginx image turns /etc/nginx/templates/X.template into /etc/nginx/conf.d/X at start,
      # replacing ${DOMAIN}. Switching http <-> https = change NGINX_MODE and recreate this container.
      - ./nginx/${NGINX_MODE:-http}:/etc/nginx/templates:ro
      - /var/www/certbot:/var/www/certbot:ro # files certbot puts there to prove domain ownership
      - /etc/letsencrypt:/etc/letsencrypt:ro # certificates created by certbot on the host
    depends_on:
      - node-frontend
      - python-frontend
      - go-frontend
      - java-frontend
    networks: # edge joins EVERY app network (it must reach every frontend); apps cannot see each other
      - node
      - python
      - go
      - java

  # ---------------- Node app (React + Express + MongoDB) ----------------
  node-frontend:
    image: ${REGISTRY}/devops-lab/node-frontend:latest
    restart: unless-stopped
    depends_on:
      - node-backend
    networks:
      - node

  node-backend:
    image: ${REGISTRY}/devops-lab/node-backend:latest
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://node-mongo:27017
    depends_on:
      node-mongo:
        condition: service_healthy
    networks:
      node:
        aliases:
          - backend # the frontend image's nginx.conf calls http://backend:3000

  node-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - node-mongo-data:/data/db
      - ../apps/nodejs/db/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - node

  # ---------------- Python app (Angular + FastAPI + PostgreSQL) ----------------
  python-frontend:
    image: ${REGISTRY}/devops-lab/python-frontend:latest
    restart: unless-stopped
    depends_on:
      - python-backend
    networks:
      - python

  python-backend:
    image: ${REGISTRY}/devops-lab/python-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notes:${PYTHON_DB_PASSWORD}@python-postgres:5432/notesdb
    depends_on:
      python-postgres:
        condition: service_healthy
    networks:
      python:
        aliases:
          - backend # the frontend image's nginx.conf calls http://backend:8000

  python-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes
      # ":?" = stop with this error if the variable is missing, instead of starting with an empty password
      POSTGRES_PASSWORD: ${PYTHON_DB_PASSWORD:?add PYTHON_DB_PASSWORD to .env}
      POSTGRES_DB: notesdb
    volumes:
      - python-pg-data:/var/lib/postgresql/data
      - ../apps/python/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notes -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - python

  # ---------------- Go app (React + Gin + PostgreSQL, Redis as cache) ----------------
  go-frontend:
    image: ${REGISTRY}/devops-lab/go-frontend:latest
    restart: unless-stopped
    depends_on:
      - go-backend
    networks:
      - go

  go-backend:
    image: ${REGISTRY}/devops-lab/go-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://notes:${GO_DB_PASSWORD}@go-postgres:5432/notesdb
      REDIS_ADDR: go-redis:6379
    depends_on:
      go-postgres:
        condition: service_healthy
      go-redis:
        condition: service_started # only a cache: "running" is enough
    networks:
      go:
        aliases:
          - backend # the frontend image's nginx.conf calls http://backend:8080

  go-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${GO_DB_PASSWORD:?add GO_DB_PASSWORD to .env}
      POSTGRES_DB: notesdb
    volumes:
      - go-pg-data:/var/lib/postgresql/data
      - ../apps/go/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notes -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - go

  go-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pure cache: no disk, max 64 MB, evict least recently used keys when full. No volume needed.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - go

  # ---------------- Java app (Angular + Spring Boot + MySQL) ----------------
  java-frontend:
    image: ${REGISTRY}/devops-lab/java-frontend:latest
    restart: unless-stopped
    depends_on:
      - java-backend
    networks:
      - java

  java-backend:
    image: ${REGISTRY}/devops-lab/java-backend:latest
    restart: unless-stopped
    environment: # override application.properties inside the jar
      SPRING_DATASOURCE_URL: jdbc:mysql://java-mysql:3306/notesdb?connectionTimeZone=UTC
      SPRING_DATASOURCE_USERNAME: notes
      SPRING_DATASOURCE_PASSWORD: ${JAVA_DB_PASSWORD}
    depends_on:
      java-mysql:
        condition: service_healthy
    networks:
      java:
        aliases:
          - backend # the frontend image's nginx.conf calls http://backend:8080

  java-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notesdb
      MYSQL_USER: notes
      MYSQL_PASSWORD: ${JAVA_DB_PASSWORD:?add JAVA_DB_PASSWORD to .env}
      MYSQL_ROOT_PASSWORD: ${JAVA_DB_ROOT_PASSWORD:?add JAVA_DB_ROOT_PASSWORD to .env}
    volumes:
      - java-mysql-data:/var/lib/mysql
      - ../apps/java/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ = a literal $ for compose: the CONTAINER's shell reads its own MYSQL_PASSWORD,
      # so the password is not written into the healthcheck command (visible in docker inspect)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u notes -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - java

# One private network per app: the Node containers cannot even see the other apps' databases.
networks:
  node: {}
  python: {}
  go: {}
  java: {}

volumes:
  node-mongo-data: {}
  python-pg-data: {}
  go-pg-data: {}
  java-mysql-data: {}
